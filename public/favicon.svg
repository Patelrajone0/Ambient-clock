<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b2e" />
      <stop offset="70%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Hour Hand Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Minute Hand Gradient -->
    <linearGradient id="minGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="aura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle / Circle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Ambient Glow Behind Clock -->
  <circle cx="256" cy="256" r="170" fill="#38bdf8" opacity="0.18" filter="url(#aura)" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Inner Subtle Track -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="4 8" />

  <!-- Hour Ticks -->
  <!-- 12 o'clock -->
  <rect x="254" y="80" width="4" height="16" rx="2" fill="#ffffff" opacity="0.9" />
  <!-- 3 o'clock -->
  <rect x="416" y="254" width="16" height="4" rx="2" fill="#ffffff" opacity="0.6" />
  <!-- 6 o'clock -->
  <rect x="254" y="416" width="4" height="16" rx="2" fill="#ffffff" opacity="0.6" />
  <!-- 9 o'clock -->
  <rect x="80" y="254" width="16" height="4" rx="2" fill="#ffffff" opacity="0.6" />

  <!-- Clock Hands (10:10 aesthetic) -->
  <!-- Hour hand pointing towards 10 o'clock (~300 deg) -->
  <g transform="rotate(305 256 256)" filter="url(#glow)">
    <rect x="252" y="150" width="8" height="110" rx="4" fill="url(#handGrad)" />
  </g>

  <!-- Minute hand pointing towards 2 o'clock (~60 deg) -->
  <g transform="rotate(55 256 256)" filter="url(#glow)">
    <rect x="253" y="112" width="6" height="146" rx="3" fill="url(#minGrad)" />
  </g>

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="14" fill="#07070a" stroke="#38bdf8" stroke-width="4" />
  <circle cx="256" cy="256" r="5" fill="#ffffff" />
</svg>
