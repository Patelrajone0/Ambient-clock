services:
  - type: web
    name: ambient-clock
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

